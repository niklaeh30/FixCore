name: Announce new NettBoost release

on:
  push:
    branches: [main]
    paths:
      - "nettboost_version.json"
      - "FixCore_NettBoost_Setup.exe"

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read nettboost_version.json and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          VERSION=$(jq -r '.version' nettboost_version.json)
          CHANGELOG=$(jq -r '.changelog' nettboost_version.json)
          DOWNLOAD_URL=$(jq -r '.download_url' nettboost_version.json)

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "content": "@everyone",
            "embeds": [
              {
                "title": "⚡ NettBoost (Lagster) ${VERSION} is out now!",
                "description": "${CHANGELOG}\n\n[⬇️ Download here](${DOWNLOAD_URL})",
                "color": 2201331,
                "footer": { "text": "NettBoost • Release ${VERSION}" },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
