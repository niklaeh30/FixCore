name: Announce new FixCore release

on:
  push:
    branches: [main]
    paths:
      - "FixCore-Setup.exe"

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read version.json and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          VERSION=$(jq -r '.version' version.json)
          CHANGELOG=$(jq -r '.changelog' version.json)
          DOWNLOAD_URL=$(jq -r '.download_url' version.json)
          TYPE=$(jq -r '.type // "update"' version.json)

          case "$TYPE" in
            update)       EMOJI="🚀"; LABEL="Update";       COLOR=3062015  ;;
            bug_fix)      EMOJI="🐛"; LABEL="Bug Fix";      COLOR=3066993  ;;
            feature)      EMOJI="✨"; LABEL="New Feature";  COLOR=9109247  ;;
            maintenance)  EMOJI="🛠️"; LABEL="Maintenance";  COLOR=15105570 ;;
            important)    EMOJI="⚠️"; LABEL="Important";    COLOR=15158332 ;;
            *)            EMOJI="📢"; LABEL="Announcement"; COLOR=3062015  ;;
          esac

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "content": "@everyone",
            "embeds": [
              {
                "title": "${EMOJI} FixCore ${VERSION} — ${LABEL}",
                "description": "${CHANGELOG}\n\n[⬇️ Download here](${DOWNLOAD_URL})",
                "color": ${COLOR},
                "footer": { "text": "FixCore • ${LABEL} • ${VERSION}" },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
