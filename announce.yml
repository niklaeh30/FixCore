name: Announce new FixCore release

on:
  push:
    branches: [main]
    paths:
      - "FixCore-Setup.exe"
      - "version.json"

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Poster bare hvis "version" i version.json er endret siden forrige push
      - name: Sjekk om versjonen er endret
        id: ver
        run: |
          NEW=$(jq -r '.version' version.json)
          OLD=$(git show "${{ github.event.before }}:version.json" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          echo "ny=$NEW gammel=$OLD"
          if [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Versjonen er lik - ingen melding sendes."
          fi

      - name: Post til Discord
        if: steps.ver.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          VERSION=$(jq -r '.version' version.json)
          CHANGELOG=$(jq -r '.changelog' version.json)
          DOWNLOAD_URL=$(jq -r '.download_url' version.json)
          TYPE=$(jq -r '.type // "update"' version.json)

          case "$TYPE" in
            update)      EMOJI="🚀"; COLOR=3062015 ;;
            bug_fix)     EMOJI="🐛"; COLOR=3066993 ;;
            feature)     EMOJI="✨"; COLOR=9109247 ;;
            maintenance) EMOJI="🛠️"; COLOR=15105570 ;;
            important)   EMOJI="⚠️"; COLOR=15158332 ;;
            *)           EMOJI="📢"; COLOR=3062015 ;;
          esac

          jq -n \
            --arg title "$EMOJI FixCore $VERSION is out now!" \
            --arg desc "$CHANGELOG

[⬇️ Download here]($DOWNLOAD_URL)" \
            --arg footer "FixCore • Release $VERSION" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson color "$COLOR" \
            '{content: "@everyone", embeds: [{title: $title, description: $desc, color: $color, footer: {text: $footer}, timestamp: $ts}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d @-
